<!DOCTYPE html><html><body style="margin:0">
<iframe id="f" src="./03-PWA/index.html" style="width:360px;height:700px;border:0"></iframe>
<script>
document.getElementById('f').addEventListener('load',()=>{
  var t=0;
  (function go(){ t++;
    var d=document.getElementById('f').contentDocument;
    if(!d.querySelector('nav button')&&t<20) return setTimeout(go,400);
    var btns=d.querySelectorAll('nav button');
    var vw=d.documentElement.clientWidth;
    var items=[];
    btns.forEach(function(b){
      var r=b.getBoundingClientRect();
      items.push(b.textContent.trim()+' w='+Math.round(r.width));
    });
    var nav=d.querySelector('nav');
    document.title='NAV|按钮数='+btns.length+'|视口='+vw+'|navScrollW='+nav.scrollWidth
      +'|'+items.join(', ');
  })();
});
</script></body></html>
